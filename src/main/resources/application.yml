spring:
  config:
    import: optional:file:.env[.properties],optional:file:auth-service-spring-mini-project-group-03/.env[.properties]
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/api_db}
    username: ${SPRING_DATASOURCE_USERNAME:David}
    password: ${SPRING_DATASOURCE_PASSWORD:Davit123}
  security:
    oauth2:
      resource-server:
        jwt:
          # Tokens from browser use public Keycloak URL (localhost:8081).
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/rest-api}
          # Inside Docker, fetch JWKS via internal service name; locally same as issuer host.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/rest-api/protocol/openid-connect/certs}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  ssl:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

keycloak:
  # Local app + compose Keycloak port mapping: 8081. In Docker network: http://keycloak:8080
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:rest-api}
  client-id: ${KEYCLOAK_CLIENT_ID:oauth-admin-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:59adTLMPCAnew2UnwRcxYKKwbhCqgEsN}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-name: ${MINIO_ACCESS_NAME:admin}
  access-secret: ${MINIO_ACCESS_SECRET:admin123}
  bucket-name: ${MINIO_BUCKET_NAME:mini-project}

server:
  port: ${SERVER_PORT:8082}

bakong:
  account-id: ${BAKONG_ACCOUNT_ID:}
  base-url: ${BAKONG_BASE_URL:https://api-bakong.nbc.gov.kh}
  email: ${EMAIL:}

onesignal:
  app-id: ${ONESIGNAL_APP_ID:}
  rest-api-key: ${ONESIGNAL_REST_API_KEY:}
